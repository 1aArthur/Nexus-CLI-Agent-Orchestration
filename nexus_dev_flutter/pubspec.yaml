name: nexus_dev_orchestrator
description: AI DevOps Command Center with Multi-Agent Swarm - Flutter Edition
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.0.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Networking
  http: ^1.2.0
  web_socket_channel: ^2.4.0

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_markdown_quill: ^0.7.8+1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # Audio / TTS
  flutter_tts: ^4.0.0
  permission_handler: ^11.3.1
  record: ^5.1.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^1.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
